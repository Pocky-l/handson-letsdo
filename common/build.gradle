// The stations, scenes and assets, compiled against plain Minecraft, the Diegesis API and the Let's Do mods. Nothing here may
// use a loader API: that goes through the loader projects.
plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }
}

dependencies {
    // The mixins into the Let's Do mods: Vinery's barrel ferments the station's way, Farm & Charm's pot waits for the spoon.
    compileOnly 'org.spongepowered:mixin:0.8.5'
    // The mixin plugin's interface names ASM's class node; the loaders bring ASM at runtime.
    compileOnly 'org.ow2.asm:asm-tree:9.5'
    compileOnly "com.pockyl.diegesis:common:${diegesis_version}"
    // The NeoForge builds stand for both loaders (they are in Mojang names like this project): a Let's Do mod's own classes have
    // the same names and members in its Fabric build.
    compileOnly "maven.modrinth:lets-do-vinery:${vinery_version}"
    compileOnly "maven.modrinth:lets-do-farm-charm:${farm_and_charm_version}"
    compileOnly "maven.modrinth:lets-do-herbalbrews:${herbalbrews_version}"
    compileOnly "maven.modrinth:lets-do-candlelight-farmcharm-compat:${candlelight_version}"
    compileOnly "maven.modrinth:lets-do-foundation:${foundation_version}"
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
