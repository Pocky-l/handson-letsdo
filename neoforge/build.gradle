plugins {
    id 'multiloader-loader'
    id 'idea'
    id 'net.neoforged.moddev'
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            // Own directory: in run/ it would share the folder with the dev client.
            gameDirectory = project.file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Dependencies added to localRuntime are available in dev runs but are not published as dependencies.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // NeoForge mods are published in Mojang names: they run in the development environment as they are, mixins included.
    implementation "com.pockyl.diegesis:neoforge:${diegesis_version}"
    // Compiled against only: every Let's Do mod is optional. The game tests run with the set below.
    compileOnly "maven.modrinth:lets-do-vinery:${vinery_version}"
    compileOnly "maven.modrinth:lets-do-farm-charm:${farm_and_charm_version}"
    compileOnly "maven.modrinth:lets-do-herbalbrews:${herbalbrews_version}"
    compileOnly "maven.modrinth:lets-do-candlelight-farmcharm-compat:${candlelight_version}"
    compileOnly "maven.modrinth:lets-do-wok-bowl:${wok_and_bowl_version}"
    compileOnly "maven.modrinth:lets-do-foundation:${foundation_version}"
}

// The Let's Do mods the game tests run with (Modrinth version ids in gradle.properties). -Pbare runs with none of them: the
// mod must load and make no station. -Ponly=<mod id> runs with that one alone (and Architectury, which each of them needs).
var bare = providers.gradleProperty('bare').isPresent()
var only = providers.gradleProperty('only').getOrNull()
if (!bare) {
    var letsDo = [
            vinery        : "lets-do-vinery:${vinery_version}",
            farm_and_charm: "lets-do-farm-charm:${farm_and_charm_version}",
            herbalbrews   : "lets-do-herbalbrews:${herbalbrews_version}",
            candlelight   : "lets-do-candlelight-farmcharm-compat:${candlelight_version}",
            bakery        : "lets-do-bakery-farmcharm-compat:${bakery_version}",
            brewery       : "lets-do-brewery-farmcharm-compat:${brewery_version}",
            meadow        : "lets-do-meadow:${meadow_version}",
            wok_and_bowl  : "lets-do-wok-bowl:${wok_and_bowl_version}",
    ]
    dependencies {
        localRuntime "maven.modrinth:architectury-api:${architectury_version}"
        localRuntime "maven.modrinth:lets-do-foundation:${foundation_version}"
        letsDo.findAll { only == null || it.key == only }.each { localRuntime "maven.modrinth:${it.value}" }
    }
}

var prepareGameTestServer = tasks.register('prepareGameTestServer') {
    var dir = project.file('run/gametest')
    outputs.dir(new File(dir, 'config'))
    outputs.upToDateWhen { false }
    doLast {
        // One mod-loading thread: several of the series' mods fill the game's flammability map during the parallel setup, and
        // now and then two of them break it at once and the server does not start.
        new File(dir, 'config').mkdirs()
        new File(dir, 'config/fml.toml').text = 'maxThreads = 1' + System.lineSeparator()
        // A wine in ten seconds, not five minutes, where Vinery has written its config already: one test waits for a wine.
        var vinery = new File(dir, 'config/vinery.json')
        if (vinery.exists()) {
            vinery.text = vinery.text.replaceFirst(/"totalFermentationTime":\s*\d+/, '"totalFermentationTime": 200')
        }
    }
}
tasks.named('runGameTestServer') { dependsOn prepareGameTestServer }

// The dev client runs in run/ with one mod-loading thread for the same reason.
var prepareClient = tasks.register('prepareClient') {
    var config = project.file('run/config')
    outputs.upToDateWhen { false }
    doLast {
        config.mkdirs()
        new File(config, 'fml.toml').text = 'maxThreads = 1' + System.lineSeparator()
    }
}
tasks.named('runClient') { dependsOn prepareClient }

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version                : minecraft_version,
            minecraft_version_range          : minecraft_version_range,
            neo_version                      : neo_version,
            loader_version_range             : loader_version_range,
            mod_id                           : mod_id,
            mod_name                         : mod_name,
            mod_license                      : mod_license,
            mod_version                      : mod_version,
            mod_authors                      : mod_authors,
            mod_description                  : mod_description,
            mod_url                          : mod_url,
            diegesis_version_range           : diegesis_version_range,
            vinery_min_version               : vinery_min_version,
            farm_and_charm_min_version       : farm_and_charm_min_version,
            herbalbrews_min_version          : herbalbrews_min_version,
            candlelight_min_version          : candlelight_min_version,
            wok_and_bowl_min_version         : wok_and_bowl_min_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

publishMods {
    file = tasks.named('jar', Jar).flatMap { it.archiveFile }
    displayName = "${mod_name} ${mod_version}+${minecraft_version} (NeoForge)"
    modLoaders.add('neoforge')
}
