modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="${mod_url}/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
displayURL="${mod_url}"
description='''${mod_description}'''
# Adds nothing to the registries: a client without the mod joins a server with it, and keeps the Let's Do menus there.
displayTest="IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="diegesis"
    type="required"
    versionRange="${diegesis_version_range}"
    ordering="AFTER"
    side="BOTH"

# Every Let's Do mod is optional: its stations come with it.
[[dependencies.${mod_id}]]
    modId="vinery"
    type="optional"
    versionRange="[${vinery_min_version},)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="farm_and_charm"
    type="optional"
    versionRange="[${farm_and_charm_min_version},)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="herbalbrews"
    type="optional"
    versionRange="[${herbalbrews_min_version},)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="candlelight"
    type="optional"
    versionRange="[${candlelight_min_version},)"
    ordering="AFTER"
    side="BOTH"

[[mixins]]
config="${mod_id}.mixins.json"
