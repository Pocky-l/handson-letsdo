org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Environment
minecraft_version=1.20.1
minecraft_version_range=[1.20.1]
forge_version=47.4.26
# The lowest Forge (and NeoForge 1.20.1) version the mod accepts.
forge_version_range=[47,)
loader_version_range=[47,)
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03
# Fabric: the versions to build with; the *_min_version ones are what fabric.mod.json asks of players.
fabric_loader_version=0.19.2
fabric_loader_min_version=0.15.0
fabric_api_version=0.92.12+1.20.1
fabric_api_min_version=0.92.0
diegesis_version=1.0.0-beta.19.2
diegesis_version_range=[1.0.0-beta.19.2,)
# The Let's Do mods whose stations this mod turns into scenes: Modrinth version ids, Forge then Fabric. All optional for
# players; *_min_version is the oldest build a station is made for.
# Vinery 1.4.41
vinery_version=2I4cH49O
vinery_fabric_version=Xv8zHKzi
vinery_min_version=1.4.41
# Farm & Charm 1.0.14
farm_and_charm_version=9fzY3YV6
farm_and_charm_fabric_version=sMjnKy5B
farm_and_charm_min_version=1.0.14
# HerbalBrews 1.0.12
herbalbrews_version=qKfEj2BA
herbalbrews_fabric_version=txZ8qKXK
herbalbrews_min_version=1.0.12
# Candlelight 2.0.5 (its Farm & Charm compat build, the one the series goes on with)
candlelight_version=MAbMsxdU
candlelight_fabric_version=RUk2PHO1
candlelight_min_version=2.0.5
# The rest only runs in the game tests so far: their stations are not made yet.
# Architectury API 9.2.14, needed by every Let's Do mod
architectury_version=1MKTLiiG
architectury_fabric_version=WbL7MStR
# Bakery 2.0.6
bakery_version=Bz6DYFDT
bakery_fabric_version=KEv4JeEB
# Brewery 2.0.6
brewery_version=CC0M409e
brewery_fabric_version=W2QrBsrL
# Meadow 1.3.25
meadow_version=phZQOZzG
meadow_fabric_version=phaFB3JP
# NetherVinery 1.2.19: five more wines for the barrel
nethervinery_version=am5K7Gy8
nethervinery_fabric_version=4M0Gv3T4

## Mod
mod_id=handson_letsdo
mod_name=Hands-On Let's Do
mod_version=1.2.0
mod_group_id=com.pockyl.handson_letsdo
mod_license=MIT
mod_authors=Pocky
mod_description=Work at the Let's Do stations with your hands: their menus become interactive in-world scenes.
mod_url=https://github.com/Pocky-l/handson-letsdo

## CurseForge
# Numeric project ID from the CurseForge project page ("About Project" sidebar).
curseforge_project_id=1827173
curseforge_client=true
curseforge_server=true
# Comma-separated CurseForge project slugs; curseforge_requires_<loader> replaces the list for that loader.
curseforge_requires=diegesis
curseforge_requires_fabric=diegesis,fabric-api
curseforge_optional=lets-do-vinery,lets-do-farm-charm,lets-do-herbal-brews,lets-do-candlelight-farm-charm-compat
