org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Environment
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.253
# The plain Minecraft the common project compiles against (https://projects.neoforged.net/neoforged/neoform).
neo_form_version=1.21.1-20240808.144430
loader_version_range=[1,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
# Fabric: the versions to build with; the *_min_version ones are what fabric.mod.json asks of players.
fabric_loader_version=0.19.5
fabric_loader_min_version=0.16.1
fabric_api_version=0.116.17+1.21.1
fabric_api_min_version=0.102.0
diegesis_version=1.0.0-beta.19.2
diegesis_version_range=[1.0.0-beta.19.2,)
# The Let's Do mods whose stations this mod turns into scenes: Modrinth version ids, NeoForge then Fabric. All optional for
# players; *_min_version is the oldest build a station is made for.
# Vinery 1.5.6
vinery_version=NmoLFrhq
vinery_fabric_version=r0pP4RB4
vinery_min_version=1.5.6
# Farm & Charm 1.1.30
farm_and_charm_version=MHwqmUI6
farm_and_charm_fabric_version=auCQEzKs
farm_and_charm_min_version=1.1.29
# HerbalBrews 1.1.4
herbalbrews_version=kGYbyn9P
herbalbrews_fabric_version=43g8sVYA
herbalbrews_min_version=1.1.4
# Foundation 1.1.0, the series' library: a mod of its own since the series' builds of 2026-11-22 (Vinery 1.5.6
# and HerbalBrews 1.1.4 still nest 1.0.x; the loader takes the newest). Its recipe
# lock is the one the stations ask.
foundation_version=eJNr3phb
foundation_fabric_version=m8xoJDLo
# The rest only runs in the game tests. NetherVinery has no 1.21.1 build.
# Architectury API 13.0.12, needed by every Let's Do mod
architectury_version=xGfBrBzj
architectury_fabric_version=WklfM1A0
# Candlelight 2.1.16
candlelight_version=VBjFCOjP
candlelight_fabric_version=Yw64ThyM
# Bakery 2.1.12
bakery_version=DCBD28KS
bakery_fabric_version=glNI0nRE
# Brewery 2.1.14
brewery_version=fPV9Ioh1
brewery_fabric_version=ZSxRujNz
# Meadow 1.4.11
meadow_version=7Vh0PDaP
meadow_fabric_version=XfL38dSg
# Cloth Config 15.0.140: the Fabric builds of the series need it as a jar of its own on this line
cloth_config_fabric_version=HpMb5wGb

## Mod
mod_id=handson_letsdo
mod_name=Hands-On Let's Do
mod_version=1.0.1
mod_group_id=com.pockyl.handson_letsdo
mod_license=MIT
mod_authors=Pocky
mod_description=Work at the Let's Do stations with your hands: their menus become interactive in-world scenes.
mod_url=https://github.com/Pocky-l/handson-letsdo

## CurseForge
# Numeric project ID from the CurseForge project page ("About Project" sidebar).
curseforge_project_id=1827173
curseforge_client=true
curseforge_server=true
# Comma-separated CurseForge project slugs; curseforge_requires_<loader> replaces the list for that loader.
curseforge_requires=diegesis
curseforge_requires_fabric=diegesis,fabric-api
curseforge_optional=lets-do-vinery,lets-do-farm-charm,lets-do-herbal-brews
